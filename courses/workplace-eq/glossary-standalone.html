<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- seo: managed by _seo/seo.py -->
<meta name="robots" content="noindex">
<script defer src="/analytics.js"></script>

<title>My Glossary | Workplace EQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Workplace EQ — Shared Theme
   Reskin: Claude Design handoff "Annual Report · Bottle" (6b).
   Corporate-editorial: tall condensed Archivo headlines, a strict
   12-column grid, thin ink rules, warm paper, racing-green palette,
   square corners everywhere, no shadows.

   Every class name the shared engine (course-engine.js) and the
   generators emit is kept, so behaviour is unchanged — only the
   styling moved. Engine markup that still carries inline
   var(--radius-*) / var(--accent) values picks up the new look
   through the tokens below.
   ============================================================ */

:root{
  /* Palette (design tokens from the handoff) */
  --paper:#F4F1E8;
  --ink:#14231C;
  --bottle:#1D4A35;
  --green:#1E6B47;
  --green-light:#8FD1AB;
  --mint:#B8E3C8;
  --hero-body:#E3EFE6;
  --tint:#DCEBE0;
  --grey-rule:#CCCCCC;
  --grey-text:#888888;
  --grey-label:#555555;
  --red:#A23B2A;
  --red-bg:#F6E3DE;

  /* Engine-facing role tokens (mapped onto the palette) */
  --bg:var(--paper);
  --surface:transparent;
  --surface-alt:#EAE6DA;
  --border:var(--ink);
  --border-strong:var(--ink);
  --text:var(--ink);
  --text-secondary:#3E4A44;
  --text-tertiary:var(--grey-text);
  --accent:var(--green);
  --accent-dark:var(--bottle);
  --accent-soft:var(--tint);
  --accent-soft-border:var(--green);
  --ok:var(--green);
  --ok-bg:var(--tint);
  --ok-border:var(--green);
  --bad:var(--red);
  --bad-bg:var(--red-bg);
  --bad-border:var(--red);
  --warn:var(--ink);
  --warn-bg:transparent;
  --warn-border:var(--green);
  --c-present:var(--green);
  --c-present-bg:var(--tint);
  --c-continuous:var(--bottle);
  --c-continuous-bg:var(--tint);
  --c-past:var(--green);
  --c-future:var(--ink);
  --c-modal:var(--green);

  --font-sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-serif:'Archivo',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;

  --radius-lg:0;
  --radius-md:0;
  --radius-sm:0;
  --radius-pill:0;

  --gutter:40px;
  --maxw:1080px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-sans);color:var(--ink);background:var(--paper);
  line-height:1.6;-webkit-font-smoothing:antialiased;font-size:16px;
}
h1,h2,h3,h4{font-weight:800;letter-spacing:0}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px}
button{font-family:inherit}

/* Body theme classes: in this design every section uses the same green. */
body.theme-presence,body.theme-communication,body.theme-velocity{--accent:var(--green)}

/* ---------- Page frame ---------- */
.eq-wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 0 80px}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 20px}

/* Top nav bar (every page) */
.eq-nav{background:var(--bottle);color:var(--paper);font-size:13px;font-weight:600;letter-spacing:.02em}
.eq-nav .eq-wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}
.eq-nav a{text-decoration:none;transition:opacity .15s}
.eq-nav a:hover{opacity:.85}
.eq-nav .eq-nav-links{display:flex;gap:24px;flex-wrap:wrap}
.eq-nav .eq-hl{color:var(--green-light)}
.course-attribution{display:none}

/* Lesson / test header band */
.eq-band{background:var(--green);color:var(--paper)}
.eq-band .grid12{padding-top:40px;padding-bottom:40px}
.eq-band-meta{grid-column:1 / span 3;font-size:13px;font-weight:700;line-height:1.5;display:flex;flex-direction:column;gap:14px}
.eq-band-meta .sec-name{color:var(--mint)}
.eq-band-main{grid-column:4 / span 9;display:flex;flex-direction:column;gap:18px}
.lesson-title{
  font-stretch:68%;font-weight:800;font-size:clamp(48px,7.4vw,88px);line-height:.88;
  text-transform:uppercase;letter-spacing:-.01em;color:var(--paper);margin:0;text-wrap:balance;
}
.lesson-sub{font-size:19px;line-height:1.45;font-weight:500;color:var(--paper);text-wrap:pretty}
.pb-track{background:rgba(244,241,232,.25);height:4px;overflow:hidden;max-width:180px}
.pb-fill{height:4px;background:var(--mint);transition:width .35s}
#sync-status{font-size:12px;font-weight:500;color:var(--hero-body);line-height:1.45}

/* Step tabs */
.eq-steps{border-bottom:1px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:40}
.eq-steps .eq-wrap{display:grid;grid-template-columns:repeat(8,minmax(0,1fr))}
.eq-steps a{padding:10px 8px 10px 0;border-top:4px solid transparent;font-size:12px;font-weight:600;color:var(--grey-text);text-decoration:none;white-space:nowrap}
.eq-steps a:hover{color:var(--ink)}
.eq-steps a.on{border-top-color:var(--green);color:var(--ink)}

/* ---------- Section blocks ---------- */
.section{padding:40px 0 0;scroll-margin-top:48px}
.section.eq-sec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 20px;padding:40px var(--gutter) 0}
.sec-num{grid-column:1 / span 3;font-stretch:68%;font-weight:800;font-size:96px;line-height:.8;color:var(--green)}
.sec-body{grid-column:4 / span 9;display:flex;flex-direction:column;gap:18px;min-width:0}
.sec-h{font-stretch:75%;font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;margin:0}
.sec-sub{font-size:13px;font-weight:700;color:var(--green);margin-top:-8px}
.section-label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:12px}
.section-label .num{display:none}

/* Cards become open blocks separated by rules */
.card{background:transparent;border:0;border-top:2px solid var(--ink);padding:16px 0 0;margin:0}
.card + .card{margin-top:24px}
.sec-body > .card:first-of-type{border-top:0;padding-top:0}
.card h3{font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:24px;line-height:1.1;letter-spacing:0}
.card h4{font-size:13px !important;text-transform:none !important;font-weight:700;color:var(--ink) !important;letter-spacing:0 !important;border-top:0 !important}
.card p{font-size:17px;line-height:1.6}
.card p[style*="font-size:13.5px"],.card p[style*="font-size:12.5px"],.card p[style*="font-size:14.5px"],.card p[style*="font-size:14px"]{font-size:15px !important;color:var(--text-secondary) !important}

/* Key finding (all tips) */
.kf{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;border-top:2px solid var(--green);padding-top:14px;margin-top:6px}
.kf-l{font-size:13px;font-weight:700;color:var(--green);line-height:1.4}
.kf-t{font-size:16px;line-height:1.6;color:var(--ink);min-width:0}
.kf-t b,.kf-t strong{font-weight:700}
.lab-no,.lab-yes{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;margin-right:6px;vertical-align:1px}
.lab-no{background:var(--red-bg);color:var(--red)}
.lab-yes{background:var(--tint);color:var(--green)}
.tip-box,.warn-box{display:block;background:transparent;border:0;padding:0;margin:0;font-size:16px;color:var(--ink)}

/* ---------- Buttons ---------- */
.btn{
  font-family:inherit;font-size:15px;font-weight:700;padding:10px 22px;border-radius:0;
  border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .15s,color .15s,opacity .15s;
}
.btn:hover{background:var(--ink);color:#fff}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:var(--green);border-color:var(--green)}
.btn-primary:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{border-color:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.btn-ghost:hover{background:transparent;color:var(--green)}
.btn-sm{padding:8px 18px;font-size:14px}

.pill{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:0;
  border:2px solid var(--ink);background:transparent;font-size:13px;font-weight:700;color:var(--ink);
  cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;
}
.pill:hover{background:var(--tint)}
.pill.on,.mode-toggle-outline .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill[disabled]{cursor:not-allowed;pointer-events:none}
.pill[disabled]:not(.on){opacity:.45}
.signal-pill{border-color:var(--green);color:var(--green)}
.mode-toggle{display:flex;gap:0;flex-wrap:wrap}
.mode-toggle .pill + .pill{border-left:0}
.mode-toggle-outline{gap:0 !important}
.mode-toggle-outline .pill + .pill{border-left:0}
.pill.align-start{align-self:flex-start}

/* ---------- Concept widget ---------- */
#widget-area{background:transparent !important;border:2px solid var(--ink) !important;padding:18px !important;margin-top:0 !important}
.static-cell{display:flex;align-items:center;justify-content:flex-start;border:0;padding:12px;background:transparent;text-align:left;font-size:15px;color:var(--ink);min-height:20px;line-height:1.45}
.static-cell.is-primary-cell{color:var(--ink);font-weight:500}
#widget-area .static-cell.is-primary-cell:first-child{background:var(--bottle);color:#fff;font-weight:700;font-size:17px}
.static-cell.clickable-cell{cursor:pointer}
.static-cell.clickable-cell:hover{opacity:.85}
#widget-hint{font-size:13px !important;color:var(--grey-label) !important;margin-top:0 !important}
.formula{
  font-family:var(--font-sans);font-size:16px;background:transparent;border:0;border-top:1px solid var(--ink);
  padding:12px 0 4px;margin:0;line-height:1.6;color:var(--ink);border-left:0 !important;
}
.formula b{font-weight:700}
.expand-content{display:none}
.expand-content.open{display:block}
#rules-content > div{display:flex;flex-direction:column;gap:12px}

/* ---------- Answer options (A / B / C) ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;counter-reset:opt}
.opts.opts-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{
  counter-increment:opt;display:flex;flex-direction:column;gap:10px;width:100%;padding:18px;border-radius:0;
  border:2px solid var(--ink);background:transparent;font-size:17px;font-weight:600;font-family:inherit;text-align:left;
  cursor:pointer;transition:background .15s,color .15s;color:var(--ink);line-height:1.35;margin:0;
}
.opts .opt::before{content:counter(opt,upper-alpha);font-size:12px;font-weight:600;color:var(--grey-text)}
.opt:hover:not(.sel):not(.ok):not(.bad):not(.dim){background:var(--tint)}
.opt.sel{background:var(--tint);border-color:var(--green)}
.opt.ok{background:var(--bottle);border-color:var(--bottle);color:#fff;cursor:default;pointer-events:none}
.opts .opt.ok::before{content:counter(opt,upper-alpha) " \00B7  Correct";color:var(--green-light)}
.opt.bad{background:var(--red-bg);border-color:var(--red);color:var(--red);cursor:default;pointer-events:none}
.opts .opt.bad::before{content:counter(opt,upper-alpha) " \00B7  Not quite";color:var(--red)}
.opt.dim{opacity:.45;cursor:default;pointer-events:none}
#widget-area .opt{display:inline-flex;width:auto;padding:10px 16px;font-size:15px}
.q-text{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:12px}
.q-block + .q-block{margin-top:24px}

.fb-ok,.fb-no{font-size:15px;padding:12px 16px;border-radius:0;margin-top:10px;line-height:1.55;border-left:4px solid}
.fb-ok{background:var(--tint);color:var(--bottle);border-color:var(--green)}
.fb-no{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.error-banner{background:var(--red-bg);border:2px solid var(--red);color:var(--red);padding:12px 16px;font-size:15px;margin-top:10px;line-height:1.6}

/* ---------- Gap-fill box ---------- */
.gapbox{border:2px solid var(--ink);padding:6px 22px}
.gap-label{font-size:13px;font-weight:700;padding:16px 0 4px}
.gap-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--grey-rule)}
.gap-label + .gap-row{border-top:0}
.gap-s{flex:1;min-width:240px;font-size:19px;font-weight:500;line-height:1.7;margin:0 !important}
.gap-s input{
  border:0 !important;border-bottom:3px solid var(--green) !important;border-radius:0 !important;background:transparent;
  padding:2px 6px !important;font-family:inherit;font-size:19px;font-weight:600;color:var(--ink);min-width:120px;outline:none;
}
.gap-s input:focus{background:var(--tint)}
.gap-row .btn{margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink)}
.gap-row .btn:hover{background:var(--green);border-color:var(--green)}
.gap-row > div[id$="-fb"]{flex-basis:100%}
.gap-row > div[id$="-fb"]:empty{display:none}
.gap-row > div[id$="-fb"] > .fb-ok,.gap-row > div[id$="-fb"] > .fb-no{margin-top:0}

/* ---------- Tone cells (too blunt / just right / too stiff) ---------- */
.tone-set{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink)}
.tone-set + .tone-set{margin-top:24px}
.tone-cell{padding:16px;display:flex;flex-direction:column;gap:12px;border:0;border-right:1px solid var(--ink);cursor:pointer;text-align:left;background:transparent;font-family:inherit;color:var(--ink)}
.tone-cell:first-child{padding-left:0}
.tone-cell:last-child{border-right:0;padding-right:0}
.tone-cell.is-right{background:var(--tint);padding-left:16px;padding-right:16px}
.tone-lbl{font-size:13px;font-weight:700}
.tone-cell.is-right .tone-lbl{color:var(--green)}
.tone-bar{height:8px;background:var(--ink);display:block}
.tone-cell.is-right .tone-bar{background:var(--green)}
.tone-line{font-size:19px;font-weight:600;line-height:1.3}
.tone-why{font-size:15px;line-height:1.5;font-weight:400;color:var(--text-secondary);display:none;border-top:1px solid var(--ink);padding-top:10px}
.tone-cell:hover .tone-why,.tone-cell.open .tone-why{display:block}
.tone-hint{font-size:13px;color:var(--grey-label)}
.culture{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;border-top:2px solid var(--ink);padding-top:14px;font-size:15px;line-height:1.5}
.culture-h{font-size:13px;font-weight:700;margin-bottom:6px}
.sec-sub-h{font-stretch:75%;font-weight:800;font-size:32px;line-height:1.05;text-transform:uppercase}

/* legacy hover compare (kept for any page still using it) */
.compare-box{display:inline-block;padding:4px 10px;background:var(--surface-alt);cursor:default}
.compare-row{display:grid;grid-template-columns:170px 1fr;gap:6px 10px;align-items:baseline}
#compare-tooltip{position:absolute;z-index:80;max-width:280px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);font-size:14px;line-height:1.5;padding:10px 12px;pointer-events:none;opacity:0;transition:opacity .1s}
#compare-tooltip.visible{opacity:1}
.trait-pill{padding:7px 12px;border:2px solid var(--green);background:transparent;color:var(--green);font-size:13px;font-weight:700;cursor:pointer}

/* ---------- Reading passage ---------- */
.passage{font-family:var(--font-sans);font-size:17px;line-height:1.75;color:var(--ink)}
.passage p{margin-bottom:16px}
.vocab{color:var(--ink);background:var(--tint);padding:0 3px;border-radius:0;cursor:pointer;font-weight:600;border-bottom:2px solid var(--green)}
.vocab:hover{background:var(--mint)}
.gram{cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.passage.show-grammar .gram{color:var(--green);font-weight:700;border-bottom:3px solid var(--green);padding:0 1px}
.passage:not(.show-grammar) .gram{pointer-events:none}
.gram-explain{border-top:2px solid var(--green);padding:12px 0 0;font-size:15px;color:var(--ink);line-height:1.6;margin-top:10px;display:none}
.gram-explain.open{display:block}

.vocab-pop{background:var(--paper);border:2px solid var(--ink);padding:1.1rem 1.3rem;margin-top:10px;display:none}
.vocab-pop.open{display:block}
.vocab-pop-word{font-stretch:75%;font-size:28px;font-weight:800;text-transform:uppercase;line-height:1;margin-bottom:4px}
.vocab-pop-ipa{font-family:var(--font-mono);font-size:13px;color:var(--grey-label);margin-bottom:12px}
.vocab-pop-ex{font-size:15px;color:var(--text-secondary);font-style:italic;line-height:1.6;margin-bottom:12px}
.audio-btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:0;border:2px solid var(--ink);
  background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);transition:background .15s;margin-bottom:10px;
}
.audio-btn:hover{background:var(--tint)}
.audio-btn.playing{background:var(--green);border-color:var(--green);color:#fff}
.glossary-btn{font-size:13px}

/* Shared popup (vocab + key phrase) */
.course-popup-backdrop{position:fixed;inset:0;background:rgba(20,35,28,.45);display:none;z-index:9998}
.course-popup-box{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--paper);border:2px solid var(--ink);
  border-radius:0;box-shadow:none;padding:1.6rem 1.7rem;max-width:460px;width:calc(100% - 40px);max-height:80vh;overflow-y:auto;display:none;z-index:9999;
  font-size:16px;line-height:1.6;
}
#course-popup-root.open .course-popup-backdrop,#course-popup-root.open .course-popup-box{display:block}
.course-popup-close{position:absolute;top:8px;right:10px;background:none;border:none;font-size:24px;line-height:1;cursor:pointer;color:var(--ink);padding:4px 8px}
.course-popup-close:hover{color:var(--green)}

/* ---------- Faux-pas spotter ---------- */
.err-word{cursor:pointer;padding:1px 4px;transition:background .12s;font-size:19px;font-weight:500}
.err-word:hover{background:var(--tint)}
.err-word.err-target{background:var(--bottle);color:#fff;font-weight:700}
.err-word.err-wrong-pick{background:var(--red-bg);color:var(--red);text-decoration:line-through}

/* ---------- Sentence builder ---------- */
.builder-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:40px}
.chip{padding:8px 14px;border-radius:0;border:2px solid var(--ink);background:transparent;font-size:16px;font-weight:600;cursor:pointer;transition:background .15s}
.chip:hover{background:var(--tint)}
.chip.used{opacity:.3;pointer-events:none}
.builder-target{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px 0;border:0;border-bottom:3px solid var(--green);background:transparent}
.builder-target .chip{background:var(--bottle);border-color:var(--bottle);color:#fff;cursor:grab}
.builder-target .chip.dragging{opacity:.4}
.builder-target .chip.drag-over{outline:2.5px solid var(--green);outline-offset:2px}

/* ---------- Matching ---------- */
.match-item{width:100%;text-align:left;padding:12px 14px;border-radius:0;border:2px solid var(--ink);background:transparent;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;line-height:1.4}
.match-item:hover:not(:disabled){background:var(--tint)}
.match-item.sel{background:var(--tint);border-color:var(--green)}
.match-item.match-correct{background:var(--bottle);color:#fff;border-color:var(--bottle)}
.match-item.match-wrong{background:var(--red-bg);color:var(--red);border-color:var(--red)}

/* ---------- Speaking / listening ---------- */
.task-card{border:2px solid var(--ink);padding:22px;background:transparent}
.task-card .kicker{font-size:13px;font-weight:700;color:var(--green);margin-bottom:8px}
.task-card p{font-size:17px !important;line-height:1.6 !important}
.discuss-q{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:0;border:2px solid var(--ink);background:transparent;cursor:pointer;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);font-weight:500}
.discuss-q:hover{background:var(--tint)}
.discuss-q .chk{flex-shrink:0;width:20px;height:20px;border-radius:0;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:2px}
.discuss-q.picked{background:var(--tint);border-color:var(--green)}
.discuss-q.picked .chk{background:var(--green);border-color:var(--green)}
.discuss-q.disabled{opacity:.45;cursor:not-allowed}

   no known downside since the schema partitions by lesson_id +
   group_id, and this course's lesson ids are all distinct strings
   like "b2c1-lesson-01-..." that can never collide with the
   original course's "lesson-01-..." ids).
   The anon key is safe to be public — access is controlled by the
   RLS policies in supabase/schema.sql, not by keeping this key secret.
   ============================================================ */
window.SUPABASE_URL = ''; // preview copy: no backend
window.SUPABASE_ANON_KEY = ''; // preview copy: no backend

</script>

</div></div>
<main class="shell"><div class="eq-wrap" style="padding-top:40px">
  <header style="border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:24px">
    <div style="font-size:13px;font-weight:700;color:var(--green);margin-bottom:10px">Personal word list</div>
    <h1 style="font-stretch:68%;font-weight:800;font-size:clamp(48px,8vw,88px);line-height:.88;text-transform:uppercase">My glossary</h1>
    <p id="glossary-sub" style="font-size:17px;margin-top:14px">Loading…</p>

<script>
/* ============================================================
   Workplace EQ — Shared Engine (forked from the English+ B2+/C1 engine)
   Reused as-is from the original B1+/B2 course per the handoff
   brief (§4: "reuse course-engine.js as-is; the new course's
   lessons just need their own vocab words and dialogues to work
   with the same mechanism automatically"). Used by every
   lesson-*.html. Handles:
     - progress logging (Supabase, with a localStorage fallback so
       the course still works fully offline)
     - vocab popovers (audio / IPA / example sentence / glossary)
     - generic exercise-checking helpers (MCQ, gap-fill, error-spot,
       matching)
     - end-of-lesson score summary + PDF export
   ============================================================ */

const Course = (() => {

  /* ----------------------------------------------------------
     SUPABASE CLIENT
     Loaded from shared/supabase-config.js + the supabase-js CDN
     script, both included before this file. If either is missing
     (offline, or a lesson opened before those scripts are added),
     Course still works entirely on localStorage — every Supabase
     call below is wrapped so a missing/failed connection never
     breaks the lesson itself, it just means that device's progress
     doesn't sync until it's back online.
     ---------------------------------------------------------- */
  let supabaseClient = null;
  try {
    if (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY){
      supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    }
  } catch (e){ console.warn('Supabase client not initialised:', e); }

  function getGroupId(){
    const params = new URLSearchParams(window.location.search);
    return params.get('group') || 'local-demo';
  }
  const GROUP_ID = getGroupId();

  const knownMemberships = new Set(); // avoids re-checking group membership on every single answer
  async function ensureGroupMembership(groupId, studentName){
    if (!supabaseClient) return;
    const cacheKey = `${groupId}::${studentName}`;
    if (knownMemberships.has(cacheKey)) return;
    try {
      const { data } = await supabaseClient.from('groups').select('student_names').eq('group_id', groupId).maybeSingle();
      if (!data){
        await supabaseClient.from('groups').insert({ group_id: groupId, group_name: groupId, student_names: [studentName] });
      } else if (!data.student_names.includes(studentName)){
        await supabaseClient.from('groups').update({ student_names: [...data.student_names, studentName] }).eq('group_id', groupId);
      }
      knownMemberships.add(cacheKey);
    } catch (e){ console.warn('Supabase group membership check failed (will retry next answer):', e); }
  }

  /* ----------------------------------------------------------
     PROGRESS LOG
     Row shape mirrors the Supabase `lesson_progress` table.
     ---------------------------------------------------------- */
  const STORAGE_KEY = 'workplaceeq_progress';
  const GLOSSARY_KEY = 'workplaceeq_glossary';

  // Namespaced distinctly from the original B1+/B2 course's key so a
  // student who has taken both courses on the same device/origin gets
  // asked for their name independently in each — progress and "who am
  // I" never bleed across the two courses.
  const STUDENT_NAME_KEY = 'workplaceeq_student_name';
  function getStudentName(){
    let name = localStorage.getItem(STUDENT_NAME_KEY);
    if (!name){
      name = prompt("What's your name? (used to save your progress on this device)") || 'You';
      localStorage.setItem(STUDENT_NAME_KEY, name);
    }
    return name;
  }

  function readLog(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function writeLog(rows){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
  }

  /**
   * Log one row of progress.
   * @param {Object} p
   * @param {string} p.lessonId
   * @param {string} p.sectionId
   * @param {'auto_graded'|'oral'} p.exerciseType
   * @param {'completed'|'absent'|'not_attempted'} p.status
   * @param {string} [p.answerGiven]
   * @param {boolean|null} [p.isCorrect]
   */
  function logProgress(p){
    const rows = readLog();
    const row = {
      group_id: GROUP_ID,
      student_name: getStudentName(),
      lesson_id: p.lessonId,
      section_id: p.sectionId,
      exercise_type: p.exerciseType || 'auto_graded',
      status: p.status || 'completed',
      answer_given: p.answerGiven ?? null,
      is_correct: p.isCorrect ?? null,
      override_correct: null,
      teacher_verdict: null,
      session_date: new Date().toISOString().slice(0,10),
      timestamp: new Date().toISOString()
    };
    rows.push(row);
    writeLog(rows);

    // Mirror to Supabase in the background — never blocks the UI, and a
    // failed/offline write here doesn't lose the answer, since the
    // localStorage copy above is already saved either way.
    if (supabaseClient){
      (async () => {
        await ensureGroupMembership(row.group_id, row.student_name);
        const { session_date, timestamp, ...dbRow } = row; // timestamp has a DB default; session_date matches the DB column
        dbRow.session_date = session_date;
        const { error } = await supabaseClient.from('lesson_progress').insert(dbRow);
        if (error) console.warn('Supabase progress insert failed:', error.message);
      })();
    }
  }

  function getLessonRows(lessonId){
    return readLog().filter(r => r.lesson_id === lessonId && r.student_name === getStudentName());
  }

  /**
   * Same rows as getLessonRows, but deduplicated to only the most recent
   * attempt per section_id.
   */
  function getCurrentRows(lessonId){
    const rows = getLessonRows(lessonId);
    const latestBySection = {};
    rows.forEach(r => {
      const existing = latestBySection[r.section_id];
      if (!existing || new Date(r.timestamp) >= new Date(existing.timestamp)){
        latestBySection[r.section_id] = r;
      }
    });
    return Object.values(latestBySection);
  }

  /** Same as getCurrentRows, but keyed by section_id for quick lookup — the shape rehydration needs. */
  function getSectionMap(lessonId){
    const map = {};
    getCurrentRows(lessonId).forEach(r => { map[r.section_id] = r; });
    return map;
  }

  function resetLocalProgress(lessonId){
    const rows = readLog().filter(r => !(r.lesson_id === lessonId && r.student_name === getStudentName()));
    writeLog(rows);
  }

  function lessonScore(lessonId, sectionPrefix){
    const rows = getCurrentRows(lessonId).filter(r =>
      r.exercise_type === 'auto_graded' &&
      (!sectionPrefix || r.section_id.startsWith(sectionPrefix)) &&
      r.is_correct !== null
    );
    const correct = rows.filter(r => (r.override_correct ?? r.is_correct)).length;
    return { correct, total: rows.length };
  }

  function weakSections(lessonId){
    const rows = getCurrentRows(lessonId).filter(r => (r.override_correct ?? r.is_correct) === false);
    return [...new Set(rows.map(r => r.section_id))];
  }

  /**
   * Pulls this student's rows down from Supabase and merges them into
   * local storage. Also PRUNES any local row whose section no longer
   * exists remotely — this is what makes a teacher's "wipe" on the
   * dashboard actually show up on the student's own device. Pruning
   * only ever happens right here, immediately after a confirmed-
   * successful fetch, never on a failed one.
   * Call this right before showing/exporting results, not continuously.
   */
  async function syncFromSupabase(lessonId){
    if (!supabaseClient) return;
    try {
      const { data, error } = await supabaseClient
        .from('lesson_progress')
        .select('*')
        .eq('group_id', GROUP_ID)
        .eq('student_name', getStudentName())
        .eq('lesson_id', lessonId);
      if (error || !data) { if (error) console.warn('Sync from Supabase failed:', error.message); return; }
      const remoteSections = new Set(data.map(r => r.section_id));
      let rows = readLog();
      let changed = false;

      data.forEach(remote => {
        const idx = rows.findIndex(r => r.lesson_id === lessonId && r.student_name === getStudentName() && r.section_id === remote.section_id);
        if (idx >= 0){
          if (rows[idx].override_correct !== remote.override_correct || rows[idx].teacher_verdict !== remote.teacher_verdict){
            rows[idx].override_correct = remote.override_correct;
            rows[idx].teacher_verdict = remote.teacher_verdict;
            changed = true;
          }
        } else {
          rows.push({ ...remote, timestamp: remote.created_at || new Date().toISOString() });
          changed = true;
        }
      });

      const beforeCount = rows.length;
      rows = rows.filter(r => {
        if (r.lesson_id !== lessonId || r.student_name !== getStudentName()) return true;
        return remoteSections.has(r.section_id);
      });
      if (rows.length !== beforeCount) changed = true;

      if (changed) writeLog(rows);
    } catch (e){ console.warn('Sync from Supabase failed:', e); }
  }

  function exportReport(lessonId, lessonTitle){
    const rows = getLessonRows(lessonId);
    const report = {
      student: getStudentName(),
      lesson_id: lessonId,
      lesson_title: lessonTitle,
      generated_at: new Date().toISOString(),
      rows
    };
    const blob = new Blob([JSON.stringify(report, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${lessonId}-${getStudentName()}-progress.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function exportReportPDF(lessonId, lessonTitle, totalPossible){
    const rows = getCurrentRows(lessonId);
    const student = getStudentName();
    const date = new Date().toLocaleDateString();
    const autoRows = rows.filter(r => r.exercise_type === 'auto_graded');
    const oralRows = rows.filter(r => r.exercise_type === 'oral' && r.status === 'completed');
    const correct = autoRows.filter(r => (r.override_correct ?? r.is_correct)).length;
    const pct = autoRows.length ? Math.round((correct / autoRows.length) * 100) : 0;
    const esc = (s) => (s ?? '').toString().replace(/</g, '&lt;');

    let printRoot = document.getElementById('course-print-report');
    if (!printRoot){
      printRoot = document.createElement('div');
      printRoot.id = 'course-print-report';
      document.body.appendChild(printRoot);
    }
    printRoot.innerHTML = `
      <div style="border-bottom:3px solid #185FA5;padding-bottom:12px;margin-bottom:20px">
        <div style="font-size:11px;color:#5B6472;text-transform:uppercase;letter-spacing:.05em">Workplace EQ · English Voiced with Kris</div>
        <h1 style="font-size:21px;margin:4px 0 0">${esc(lessonTitle)}</h1>
      </div>
      <p style="font-size:13px;margin:0 0 3px"><b>Student:</b> ${esc(student)}</p>
      <p style="font-size:13px;margin:0 0 18px"><b>Date:</b> ${esc(date)}</p>
      <div style="background:#E6F1FB;border-radius:10px;padding:14px 18px;margin-bottom:${typeof totalPossible === 'number' ? '8px' : '22px'}">
        <div style="font-size:19px;font-weight:700;color:#0C4577">${correct} / ${autoRows.length} correct (${pct}%)</div>
      </div>
      ${typeof totalPossible === 'number' ? (autoRows.length < totalPossible ? `
      <div style="background:#FAEEDA;border:1px solid #E8C080;border-radius:8px;padding:10px 14px;margin-bottom:22px;font-size:12px;color:#633806">
        Note: only ${Math.round((autoRows.length / totalPossible) * 100)}% of the lesson attempted (${autoRows.length} of ${totalPossible} exercises) — this score reflects only what's been answered so far.
      </div>` : `
      <div style="background:#EAF3DE;border:1px solid #C0DD97;border-radius:8px;padding:10px 14px;margin-bottom:22px;font-size:12px;color:#27500A">
        ✓ Every exercise in this lesson has been attempted.
      </div>`) : ''}
      <h2 style="font-size:14px;margin-bottom:8px">Exercise breakdown</h2>
      <table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:22px">
        <thead><tr style="background:#EEF1F5;text-align:left">
          <th style="padding:5px 7px;border-bottom:1px solid #DFE3E9">Section</th>
          <th style="padding:5px 7px;border-bottom:1px solid #DFE3E9">Your answer</th>
          <th style="padding:5px 7px;border-bottom:1px solid #DFE3E9">Result</th>
        </tr></thead>
        <tbody>
          ${autoRows.map(r => {
            const ok = r.override_correct ?? r.is_correct;
            const resultLabel = r.override_correct !== null && r.override_correct !== undefined ? (ok ? 'Correct (revised)' : 'Needs review (revised)') : (ok ? 'Correct' : 'Needs review');
            return `<tr>
              <td style="padding:5px 7px;border-bottom:1px solid #EEF1F5">${esc(r.section_id)}</td>
              <td style="padding:5px 7px;border-bottom:1px solid #EEF1F5">${esc(r.answer_given)}</td>
              <td style="padding:5px 7px;border-bottom:1px solid #EEF1F5;color:${ok ? '#27500A' : '#791F1F'}">${resultLabel}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      ${oralRows.length ? `
        <h2 style="font-size:14px;margin-bottom:8px">Speaking / discussion</h2>
        <ul style="font-size:11.5px;padding-left:16px;margin:0">
          ${oralRows.map(r => `<li style="margin-bottom:5px">${esc(r.answer_given)} — <i>${esc(r.teacher_verdict) || 'not yet marked'}</i></li>`).join('')}
        </ul>` : ''}
    `;
    window.print();
  }

  /* ----------------------------------------------------------
     AUDIO: file-first, speechSynthesis fallback
     Checks (via cached fetch HEAD, once per session per word) whether
     a pre-generated audio file exists before falling back to the
     browser's built-in speechSynthesis. The course works immediately
     with zero real audio files present, and silently upgrades the
     moment real files are dropped in — no code changes needed.
     ---------------------------------------------------------- */
  function slugifyForAudio(text){
    return text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  const audioFileCache = new Map(); // slug -> true|false, checked once per session
  let currentAudioEl = null;
  async function speakSmart(text, fallback){
    const slug = slugifyForAudio(text);
    const src = `audio/vocab/${slug}.mp3`;
    if (!audioFileCache.has(slug)){
      try {
        const res = await fetch(src, { method: 'HEAD' });
        audioFileCache.set(slug, res.ok);
      } catch (e) { audioFileCache.set(slug, false); }
    }
    if (audioFileCache.get(slug)){
      if (currentAudioEl) currentAudioEl.pause();
      currentAudioEl = new Audio(src);
      currentAudioEl.play().catch(() => fallback());
    } else {
      fallback();
    }
  }
  function speak(text){
    speakSmart(text, () => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    });
  }

  /* ----------------------------------------------------------
     GLOSSARY
     ---------------------------------------------------------- */
  function getGlossary(){
    try { return JSON.parse(localStorage.getItem(GLOSSARY_KEY)) || {}; }
    catch (e){ return {}; }
  }
  function writeGlossaryLocal(glossary){
    localStorage.setItem(GLOSSARY_KEY, JSON.stringify(glossary));
  }

  async function saveToGlossary(wordKey, data, lessonId){
    const glossary = getGlossary();
    glossary[wordKey] = { word: data.word, ipa: data.ipa, meaning: data.meaning, example: data.example, lessonId: lessonId || null };
    writeGlossaryLocal(glossary);

    if (supabaseClient){
      (async () => {
        await ensureGroupMembership(GROUP_ID, getStudentName());
        const { error } = await supabaseClient.from('glossary').upsert({
          group_id: GROUP_ID, student_name: getStudentName(), word_key: wordKey,
          word: data.word, ipa: data.ipa, meaning: data.meaning, example: data.example, lesson_id: lessonId || null
        }, { onConflict: 'group_id,student_name,word_key' });
        if (error) console.warn('Glossary sync failed:', error.message);
      })();
    }
  }

  async function removeFromGlossary(wordKey){
    const glossary = getGlossary();
    delete glossary[wordKey];
    writeGlossaryLocal(glossary);
    if (supabaseClient){
      const { error } = await supabaseClient.from('glossary').delete()
        .eq('group_id', GROUP_ID).eq('student_name', getStudentName()).eq('word_key', wordKey);
      if (error) console.warn('Glossary remove failed:', error.message);
    }
  }

  async function syncGlossaryFromSupabase(){
    if (!supabaseClient) return;
    try {
      const { data, error } = await supabaseClient.from('glossary').select('*')
        .eq('group_id', GROUP_ID).eq('student_name', getStudentName());
      if (error || !data) { if (error) console.warn('Glossary sync failed:', error.message); return; }
      const glossary = getGlossary();
      data.forEach(r => {
        glossary[r.word_key] = { word: r.word, ipa: r.ipa, meaning: r.meaning, example: r.example, lessonId: r.lesson_id };
      });
      writeGlossaryLocal(glossary);
    } catch (e){ console.warn('Glossary sync failed:', e); }
  }

  function initVocab(vocabData, lessonId){
    document.querySelectorAll('.vocab').forEach(el => {
      el.addEventListener('click', () => {
        const key = el.dataset.word;

          btn.textContent = 'Saved ✓'; btn.disabled = true;
        });
      });
