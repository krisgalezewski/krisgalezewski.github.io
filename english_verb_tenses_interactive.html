body{font-family:var(--font-sans);color:var(--color-text-primary)}

.aspect-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.atab{padding:6px 14px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:12px;cursor:pointer;transition:all .15s}
.atab:hover{background:var(--color-background-secondary)}
.atab.on{border-color:transparent;color:#fff;font-weight:500}
.simple-a.on{background:#534AB7}.continuous-a.on{background:#854F0B}.perfect-a.on{background:#3B6D11}.perfect-cont-a.on{background:#72243E}
.main-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:20px;padding:1.5rem;margin-bottom:1rem}
.tense-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.tense-badge{font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px}
.aspect-badge{font-size:12px;padding:4px 12px;border-radius:20px;margin-left:auto}
.formula-label{font-size:11px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.formula{font-family:var(--font-mono);font-size:13px;background:var(--color-background-secondary);border-radius:14px;padding:10px 14px;margin-bottom:1rem;border-left:3px solid}
.usage-text{font-size:14px;color:var(--color-text-secondary);line-height:1.75;margin-bottom:1rem}
.hl{font-weight:500;color:var(--color-text-primary)}
.uses-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.use-chip{background:var(--color-background-secondary);border-radius:12px;padding:7px 12px;font-size:13px;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px}
.examples-label{font-size:11px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.ex-box{border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.6}
.ex-pos{background:#EAF3DE;color:#27500A;border:0.5px solid #C0DD97}
.ex-neg{background:#FCEBEB;color:#791F1F;border:0.5px solid #F7C1C1}
.ex-tag{font-size:11px;font-weight:500;margin-bottom:4px;display:block}
.signal-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.signal{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary)}
.tip-box{background:var(--color-background-secondary);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--color-text-secondary);display:flex;gap:8px;align-items:flex-start;line-height:1.6}

.q-prompt{font-size:15px;margin-bottom:1rem;line-height:1.6}

.opt:hover:not(:disabled){background:var(--color-background-secondary)}
.opt.correct{background:#EAF3DE;border-color:#C0DD97;color:#27500A;font-weight:500}
.opt.wrong{background:#FCEBEB;border-color:#F7C1C1;color:#791F1F}
.feedback{font-size:13px;padding:10px 14px;border-radius:12px;margin-bottom:10px;line-height:1.6;display:none}
.fb-ok{background:#EAF3DE;color:#27500A;display:block}
.fb-no{background:#FCEBEB;color:#791F1F;display:block}
.next-btn{font-size:13px;padding:7px 16px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;color:var(--color-text-primary)}
.overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
.ov-card{border-radius:16px;padding:10px 12px;cursor:pointer;border:0.5px solid transparent;transition:opacity .15s}
.ov-card:hover{opacity:.8}
.ov-title{font-size:12px;font-weight:500;margin-bottom:2px}
.ov-sub{font-size:11px;line-height:1.35}
</style>

      }

  },
  future: {
    color: '#993C1D', light: '#FAECE7', border: '#F0997B', text: '#712B13',
    aspects: {
      simple: {
        label: 'Future simple (will)', aspect: 'Simple',
        formula: 'Subject + will + base verb', fl: '#7F77DD',
        badge_bg: '#EEEDFE', badge_col: '#3C3489', asp_bg: '#FAECE7', asp_col: '#712B13',
        desc: 'Use <em>will</em> for <span class="hl">spontaneous decisions, predictions, promises, offers, and facts about the future</span>. Also use <em>be going to</em> for plans already decided and evidence-based predictions.',
        uses: ['Spontaneous decision','Promise / offer / threat','Prediction (no evidence)','Future fact'],
        signals: ['probably','I think / I believe','maybe / perhaps','I promise','I\'ll (on the spot)'],
        ex_pos: [
          {tag:'Spontaneous decision', s:'"It\'s cold." — "I <strong>\'ll close</strong> the window."'},
          {tag:'Prediction', s:'I think it <strong>will snow</strong> tonight.'}
        ],
        ex_neg: [{tag:'Pre-planned intention ✗', s:'I <strong>will go</strong> to Paris next month. ✗ (if booked → use going to)'}],
        tip: '<em>Will</em> = decided at the moment of speaking. <em>Be going to</em> = decided before speaking. Both can predict, but <em>going to</em> + evidence means the speaker can see it coming.',
        quiz: [
          {q:'"The phone is ringing." — "I ___ get it!"',opts:['going to','\'m going to','\'ll','would'],ans:2,fb:'Future simple (will) — a spontaneous decision made right now, not pre-planned.'},
          {q:'I promise I ___ call you as soon as I land.',opts:['\'m calling','\'m going to call','\'ll call','called'],ans:2,fb:'Future simple (will) — making a promise.'},
          {q:'Look at those clouds! It ___ rain.',opts:['\'ll','\'s going to','is raining','rains'],ans:1,fb:'"Be going to" for a prediction based on present evidence (the clouds you can see).'}
        ]
      },
      continuous: {
        label: 'Future continuous', aspect: 'Continuous',
        formula: 'Subject + will be + verb-ing', fl: '#BA7517',
        badge_bg: '#FAEEDA', badge_col: '#633806', asp_bg: '#FAECE7', asp_col: '#712B13',
        desc: 'Use the future continuous for an action <span class="hl">in progress at a specific moment in the future</span>, or to describe something that will happen as part of a normal routine or expected course of events.',
        uses: ['Action in progress at a future moment','Expected / routine future event','Polite question about plans'],
        signals: ['at this time tomorrow','at 8pm tonight','in two hours','this time next week'],
        ex_pos: [
          {tag:'In progress at future moment', s:'This time tomorrow I <strong>\'ll be flying</strong> to Tokyo.'},
          {tag:'Polite enquiry', s:'<strong>Will you be using</strong> the car tonight?'}
        ],
        ex_neg: [{tag:'Single future event ✗', s:'I <strong>will be going</strong> to the shop later. ✗ (use will go)'}],
        tip: 'Use the future continuous for polite enquiries — "Will you be attending the meeting?" sounds softer than "Will you attend?"',
        quiz: [
          {q:'This time next week, we ___ on the beach.',opts:['sit','will sit','will be sitting','are sitting'],ans:2,fb:'Future continuous — an action in progress at a specific future moment (this time next week).'},
          {q:'Don\'t call at noon — I ___ a meeting.',opts:['have','will have','will be having','am having'],ans:2,fb:'Future continuous — action in progress at a specific future time.'},
          {q:'___ you be needing the projector tomorrow?',opts:['Will','Are','Do','Would'],ans:0,fb:'Future continuous for a polite enquiry about plans.'}
        ]
      },
      perfect: {

        formula: 'Subject + will have + past participle', fl: '#1D9E75',
        badge_bg: '#E1F5EE', badge_col: '#085041', asp_bg: '#FAECE7', asp_col: '#712B13',
        desc: 'Use the future perfect to talk about <span class="hl">an action that will be completed before a specific point in the future</span>. You are looking back from a future moment at something already done.',
        uses: ['Completed before a future deadline','Achievement by a future point','Assumption about the past'],
        signals: ['by + future time','by then','by the time','before'],
        ex_pos: [

          {tag:'Assumption', s:'Don\'t call at 9 — she <strong>will have gone</strong> to bed.'}
        ],
        ex_neg: [{tag:'No deadline ✗', s:'I <strong>will have written</strong> a novel. ✗ (needs a "by" deadline)'}],
        tip: 'Think of it as: "Looking back from [future point], this action is done." The key word is almost always "by".',

          {q:'By the time you arrive, I ___ cooking.',opts:['finish','will finish','will have finished','am finishing'],ans:2,fb:'Future perfect — completed before another future point (your arrival).'},

        ]
      },
      'perfect-cont': {

        badge_bg: '#FBEAF0', badge_col: '#72243E', asp_bg: '#FBEAF0', asp_col: '#72243E',
        desc: 'Use the future perfect continuous to emphasise <span class="hl">the duration of an ongoing action up to a specific point in the future</span>. It is the rarest of the twelve tenses and focuses on length of time, not completion.',
        uses: ['Duration up to a future point','Emphasise ongoing effort','Explain a future state'],
        signals: ['for + duration','by + future time','by then'],
        ex_pos: [
          {tag:'Duration to future point', s:'By July, I <strong>will have been learning</strong> Polish for two years.'},
          {tag:'Explains a future state', s:'She\'ll be tired — she <strong>will have been travelling</strong> all day.'}
        ],
        ex_neg: [{tag:'Completed result ✗', s:'By Monday I <strong>will have been finishing</strong> the project. ✗ (use will have finished)'}],
        tip: 'This tense is rare in everyday speech. You\'ll mostly see it used to highlight impressive or exhausting durations: "By retirement, he will have been teaching for 35 years."',
        quiz: [
          {q:'By next month, they ___ on this bridge for three years.',opts:['work','will work','will have worked','will have been working'],ans:3,fb:'Future perfect continuous — duration of ongoing activity up to a future point.'},
          {q:'I\'ll be exhausted by Friday — I ___ all week.',opts:['will travel','am travelling','will have been travelling','have been travelling'],ans:2,fb:'Future perfect continuous — ongoing activity emphasising duration up to a future point (Friday).'},
          {q:'By graduation, she ___ medicine for six years.',opts:['studies','will study','will have been studying','will have studied'],ans:2,fb:'Future perfect continuous — emphasising the length of an ongoing activity up to a milestone.'}

const aspectLabels = {simple:'Simple',continuous:'Continuous',perfect:'Perfect','perfect-cont':'Perfect continuous'};
const aspectKeys = ['simple','continuous','perfect','perfect-cont'];

let curTime = 'past';
let curAspect = 'simple';
let qIdx = {};
let scores = {};
let totals = {};
let answered = {};

function key(t,a){ return t+'_'+a; }

function setTime(t){
  curTime = t;
  document.querySelectorAll('.ttab').forEach(b => b.classList.remove('on'));
  document.querySelector('.ttab.'+t).classList.add('on');
  renderOverview();
  renderAspects();
  renderMain();
}

function setAspect(a){
  curAspect = a;
  document.querySelectorAll('.atab').forEach(b => b.classList.remove('on'));
  document.querySelector('.atab[data-a="'+a+'"]').classList.add('on');
  renderMain();
}

function renderOverview(){
  const td = data[curTime];
  const grid = document.getElementById('ovGrid');
  grid.innerHTML = aspectKeys.map(a => {
    const d = td.aspects[a];
    return `<div class="ov-card" style="background:${d.badge_bg};border-color:${td.border}" onclick="setAspect('${a}')">
      <div class="ov-title" style="color:${d.badge_col}">${d.label}</div>
      <div class="ov-sub" style="color:${td.color};font-size:11px">${d.formula.split('+')[1] ? d.formula.split('+').slice(1).join('+').trim().substring(0,28)+'…' : d.formula.substring(0,28)}</div>
    </div>`;
  }).join('');
}

function renderAspects(){
  const td = data[curTime];
  const row = document.getElementById('aspectRow');
  row.innerHTML = aspectKeys.map(a =>
    `<button class="atab ${a}-a${a===curAspect?' on':''}" data-a="${a}" onclick="setAspect('${a}')">${aspectLabels[a]}</button>`
  ).join('');
}

function renderMain(){
  const td = data[curTime];
  const d = td.aspects[curAspect];
  const k = key(curTime, curAspect);
  if(!qIdx[k]){qIdx[k]=0; scores[k]=0; totals[k]=0; answered[k]=false;}

  const usesHtml = d.uses.map(u => `<div class="use-chip"><i class="ti ti-check" aria-hidden="true" style="color:${td.color};font-size:14px;flex-shrink:0"></i>${u}</div>`).join('');
  const signalsHtml = d.signals.map(s => `<span class="signal">${s}</span>`).join('');
  const exPosHtml = d.ex_pos.map(e => `<div class="ex-box ex-pos"><span class="ex-tag" style="color:#3B6D11">${e.tag}</span>${e.s}</div>`).join('');
  const exNegHtml = d.ex_neg.map(e => `<div class="ex-box ex-neg"><span class="ex-tag" style="color:#A32D2D">${e.tag}</span>${e.s}</div>`).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="main-card">
      <div class="tense-header">
        <span class="tense-badge" style="background:${d.badge_bg};color:${d.badge_col}">${d.label}</span>
        <span class="aspect-badge" style="background:${td.light};color:${td.text}">${d.aspect}</span>
      </div>
      <div class="formula-label">Formula</div>
      <div class="formula" style="border-color:${d.fl}">${d.formula}</div>
      <div class="formula-label">When to use it</div>
      <p class="usage-text">${d.desc}</p>
      <div class="uses-grid">${usesHtml}</div>
      <div class="formula-label">Time signals</div>
      <div class="signal-row" style="margin-bottom:1rem">${signalsHtml}</div>
      <div class="examples-label">Examples</div>
      <div class="ex-grid">${exPosHtml}${exNegHtml}</div>
      <div class="tip-box"><i class="ti ti-bulb" aria-hidden="true" style="font-size:16px;flex-shrink:0;margin-top:2px;color:${td.color}"></i><span>${d.tip}</span></div>
    </div>
    <div class="quiz-card" id="quizArea"></div>`;

  buildQuiz(k, d.quiz);
}

function buildQuiz(k, qs){
  const q = qs[qIdx[k]];
  document.getElementById('quizArea').innerHTML = `
    <div class="q-meta">Practice question ${qIdx[k]+1} of ${qs.length} &nbsp;·&nbsp; Score: ${scores[k]}/${totals[k]}</div>
    <p class="q-prompt">${q.q.replace('___','<span class="q-gap">___</span>').replace('___ you ___', '<span class="q-gap">___</span> you <span class="q-gap">___</span>')}</p>
    <div class="opts" id="opts_${k}">${q.opts.map((o,j)=>`<button class="opt" onclick="answer('${k}',${j})">${o}</button>`).join('')}</div>
    <div class="feedback" id="fb_${k}"></div>
    <button class="next-btn" id="next_${k}" onclick="nextQ('${k}')" style="display:none">Next question →</button>`;
  answered[k] = false;
}

function answer(k, chosen){
  if(answered[k]) return;
  answered[k] = true;
  totals[k]++;
  const [t,a] = k.split('_');
  const qs = data[t].aspects[a].quiz;
  const q = qs[qIdx[k]];
  document.querySelectorAll('#opts_'+k+' .opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans) b.classList.add('correct');
    else if(i===chosen) b.classList.add('wrong');
  });
  if(chosen===q.ans) scores[k]++;
  const fb = document.getElementById('fb_'+k);
  fb.className = 'feedback '+(chosen===q.ans?'fb-ok':'fb-no');
  fb.textContent = (chosen===q.ans?'✓ Correct! ':'✗ Not quite. ')+q.fb;
  const nxt = document.getElementById('next_'+k);
  if(qIdx[k] < qs.length-1){
    nxt.style.display='inline-block';
  } else {
    const pct = Math.round(scores[k]/totals[k]*100);
    const msg = pct===100?'Perfect score! Well done.':pct>=67?`Good work! ${scores[k]}/${totals[k]} — review the examples if needed.`:`Score: ${scores[k]}/${totals[k]} — re-read the formula and try again.`;
    const p = document.createElement('p');
    p.style.cssText='font-size:13px;color:var(--color-text-secondary);margin-top:10px';
    p.textContent = msg;
    document.getElementById('quizArea').appendChild(p);
  }
}

function nextQ(k){
  const [t,a] = k.split('_');
  qIdx[k] = (qIdx[k]+1) % data[t].aspects[a].quiz.length;
  buildQuiz(k, data[t].aspects[a].quiz);
}

setTime('past');
</script>
</body></html>
